services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:///./nexo.db
      SECRET_KEY: local-only-change-me
      JWT_SECRET: local-only-change-me
      CORS_ORIGINS: http://localhost:5173
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on: [backend]
