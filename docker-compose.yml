services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./nexo.db
      SECRET_KEY: change-me
      JWT_SECRET: change-me
      CORS_ORIGINS: http://localhost:5173
      LOGIN_USERNAME: Nexo
      LOGIN_PASSWORD: admin
  ui:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
